# Netlify deployment for IALE.
#
# The AI Tutor is bring-your-own-key and talks to the student's chosen provider
# directly from the browser, so there is no server-side secret and no proxy
# function to configure — a plain build + deploy is all that's needed.

[build]
  command = "npm run build"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
